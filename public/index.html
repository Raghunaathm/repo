<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Incident Reporter</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:20px}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
    .filters{display:flex;gap:12px;align-items:center}
    .filters label{font-size:0.95rem}
    input[type=file]{margin-bottom:10px}
    #result{margin-top:20px}
  </style>
</head>
<body>
  <header>
    <h1>Incident Reporter</h1>
    <div class="filters">
      <label>Start date: <input type="date" id="startDate" name="startDate" /></label>
      <label>End date: <input type="date" id="endDate" name="endDate" /></label>
      <label>SLA days: <input type="number" id="slaDays" name="slaDays" min="0" placeholder="15" style="width:80px" /></label>
    </div>
  </header>
  <form id="uploadForm">
    <input type="file" id="file" name="file" accept=".xlsx" required />
    <button type="submit">Upload & Process</button>
  </form>
  <div id="status"></div>
  <div id="result"></div>

  <script>
    const form = document.getElementById('uploadForm');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = document.getElementById('file').files[0];
      if (!f) return alert('Choose a file');
      status.textContent = 'Uploading...';
      result.innerHTML = '';
      const fd = new FormData();
      fd.append('file', f);
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      const sla = document.getElementById('slaDays').value;
      if (start) fd.append('startDate', start);
      if (end) fd.append('endDate', end);
      if (sla) fd.append('slaDays', sla);
      try {
        const res = await fetch('/upload', { method: 'POST', body: fd });
        if (!res.ok) throw new Error('Upload failed');
        const text = await res.text();
        status.textContent = 'Processed.';
        result.innerHTML = text;
      } catch (err) {
        console.error(err);
        status.textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
